name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -S warning $(git ls-files '*.sh')
      - name: ship-issue script tests
        run: bash tests/ship-issue-scripts.sh
